<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartTalk AI · Admin</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#20243a;background:#f4f5fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:40px auto;padding:20px}.panel{background:white;border:1px solid #e5e7f0;border-radius:16px;padding:24px;box-shadow:0 8px 28px #20243a0b}h1{margin:0 0 8px;color:#302b69}p{color:#697087}input,button{padding:12px;border:1px solid #d9dced;border-radius:9px;font:inherit}input{display:block;width:100%;margin:10px 0}button{background:#5146a8;color:#fff;border:0;cursor:pointer;margin:8px 8px 8px 0}.hidden{display:none}.status{padding:12px;background:#f2f3fa;border-radius:8px;margin:12px 0}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{text-align:left;padding:10px;border-bottom:1px solid #eceef5;vertical-align:top}th{color:#5146a8}small{color:#788099}
</style></head><body><main class="wrap"><section class="panel"><h1>✦ SmartTalk AI Admin</h1><p>Secure administration and conversation history</p><div id="login"><input id="username" autocomplete="username" placeholder="Admin username" value="admin"><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"><button id="loginBtn">Sign in</button></div><div id="dashboard" class="hidden"><div class="status" id="status">Connected</div><button id="dbBtn">Check SQL Server & initialize history table</button><button id="historyBtn">Refresh chat history</button><button id="logoutBtn">Sign out</button><div id="history"></div></div><p id="message" role="status"></p><small>Admin credentials are read from your local .env file. Do not expose this local demo publicly without HTTPS and additional security controls.</small></section></main><script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('st_admin_token')||'';function show(){ $('login').classList.toggle('hidden',!!token);$('dashboard').classList.toggle('hidden',!token);if(token)loadHistory();}async function api(path){const r=await fetch(path,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d;}$('loginBtn').onclick=async()=>{try{const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.detail);token=d.access_token;sessionStorage.setItem('st_admin_token',token);$('message').textContent='Signed in';show()}catch(e){$('message').textContent=e.message}};$('dbBtn').onclick=async()=>{try{const d=await api('/admin/database-status');$('status').textContent=d.message}catch(e){$('status').textContent=e.message}};async function loadHistory(){try{const d=await api('/admin/history');$('history').innerHTML='<h2>Recent chats</h2><table><thead><tr><th>Time</th><th>Question</th><th>Answer</th></tr></thead><tbody>'+d.items.map(x=>`<tr><td>${x.CreatedAt||''}</td><td>${esc(x.UserQuestion||'')}</td><td>${esc(x.AssistantAnswer||'')}</td></tr>`).join('')+'</tbody></table>'}catch(e){$('history').textContent=e.message}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('historyBtn').onclick=loadHistory;$('logoutBtn').onclick=()=>{token='';sessionStorage.removeItem('st_admin_token');show()};show();
</script></body></html>
